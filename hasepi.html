uniform vec2 u_view;
uniform vec2 u_img;
uniform float u_pull;

for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
  let a=y*(COLS+1)+x,b=a+1,c=a+(COLS+1),d=c+1;
  inds.push(a,c,b,b,c,d);
}
let vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.STATIC_DRAW);
let ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(inds),gl.STATIC_DRAW);
let stride=16;
let ap=gl.getAttribLocation(prog,"a_pos"), au=gl.getAttribLocation(prog,"a_uv");
gl.enableVertexAttribArray(ap);gl.vertexAttribPointer(ap,2,gl.FLOAT,false,stride,0);
gl.enableVertexAttribArray(au);gl.vertexAttribPointer(au,2,gl.FLOAT,false,stride,8);
let uv=gl.getUniformLocation(prog,"u_view"),ui=gl.getUniformLocation(prog,"u_img"),up=gl.getUniformLocation(prog,"u_pull");
gl.uniform2f(ui,IW,IH);

let tex=gl.createTexture(),ready=false;
const boyonSound=new Audio("resources/sounds/boyon.mp3");
boyonSound.preload="auto";
const gakoSound=new Audio("resources/sounds/gako.mp3");
gakoSound.preload="auto";
let pull=0,vel=0,drag=false,startY=0,last=performance.now(),S=1,OX=0,OY=0,fx=false,fxUntil=0,pendingHit=false,hadPull=false;

function resize(){
  let dpr=Math.min(devicePixelRatio||1,2);
  let W=innerWidth,H=innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  gl.viewport(0,0,cv.width,cv.height);
  // Shader uses CSS-pixel dimensions; viewport ratio remains identical.
  gl.uniform2f(uv,W,H);
  S=Math.min(W/IW,H/IH); OX=(W-IW*S)/2; OY=(H-IH*S)/2;
  el.style.left=(OX+445*S)+"px";el.style.top=(OY+562*S)+"px";
  er.style.left=(OX+842*S)+"px";er.style.top=(OY+526*S)+"px";draw();
}
function draw(){
  if(!ready)return;
  // Compensate for the canvas inversion so the surrounding background stays black.
  const bg=fx?1:0;
  gl.clearColor(bg,bg,bg,1);gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform1f(up,pull);
  gl.drawElements(gl.TRIANGLES,inds.length,gl.UNSIGNED_SHORT,0);
}
function point(e){return{x:(e.clientX-OX)/S,y:(e.clientY-OY)/S}}
function hit(q){
  let dx=(q.x-TIPX)/300,dy=(q.y-TIPY)/190;
  return dx*dx+dy*dy<1;
}
cv.addEventListener("pointerdown",e=>{
 e.preventDefault();let q=point(e);
 if(!fx && hit(q)){drag=true;startY=q.y;pull=0;vel=0;hadPull=false;try{cv.setPointerCapture(e.pointerId)}catch(_){}}
},{passive:false});
cv.addEventListener("pointermove",e=>{
 e.preventDefault();if(!drag)return;
 pull=Math.max(0,Math.min(300,point(e).y-startY));if(pull>8)hadPull=true;draw();
},{passive:false});
function release(e){
 if(e)e.preventDefault();
 if(!drag)return;
 drag=false;
 pendingHit=hadPull&&(Math.floor(Math.random()*16)===0);
 // Stop the previous bounce sound before deciding which effect to play.
 boyonSound.pause();
 boyonSound.currentTime=0;
 if(hadPull&&!pendingHit){
   boyonSound.play().catch(error=>console.warn("boyon.mp3 ??????????:",error));
 }
 hadPull=false;
}
cv.addEventListener("pointerup",release,{passive:false});
cv.addEventListener("pointercancel",release,{passive:false});
for(let ev of ["touchmove","gesturestart","gesturechange","gestureend"])document.addEventListener(ev,e=>e.preventDefault(),{passive:false});

let fxTimer=null;
function startFx(t){
 fx=true;pendingHit=false;pull=0;vel=0;
 if(fxTimer)clearTimeout(fxTimer);
 // Start the recovery timer first, so even a visual-effect error cannot lock the app.
 fxTimer=setTimeout(stopFx,5000);
 cv.style.filter="invert(1)";
 gakoSound.currentTime=0;
 gakoSound.play().catch(error=>console.warn("gako.mp3 ??????????:",error));
 if(eyes)eyes.style.display="block";
 draw();
}
function stopFx(){
 if(fxTimer){clearTimeout(fxTimer);fxTimer=null;}
 fx=false;pendingHit=false;pull=0;vel=0;
 cv.style.filter="none";
 if(eyes)eyes.style.display="none";
 draw();
}
function loop(t){
 let dt=Math.min(.032,(t-last)/1000);last=t;
 if(!fx&&!drag){
   vel+=(-105.0*pull-8.0*vel)*dt;
   pull+=vel*dt;
   if(pendingHit&&Math.abs(pull)<=12){
     startFx(t);
   }else{
     if(Math.abs(pull)<.03&&Math.abs(vel)<.03){
       pull=0;vel=0;
       if(pendingHit)startFx(t);
     }
     if(!fx)draw();
   }
 }
 requestAnimationFrame(loop);
}
let im=new Image();
im.onload=()=>{
 gl.bindTexture(gl.TEXTURE_2D,tex);
 gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 ready=true;resize();requestAnimationFrame(loop);
};
im.src=DATA;
addEventListener("resize",resize);
</script></body></html>
