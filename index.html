<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>日暮里されていませんか？</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">

  <!-- iOS用 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="日暮里">

  <link rel="apple-touch-icon" href="icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: 'Noto Sans JP', sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      position: relative;
      height: 100vh;
      width: 100%;
    }

    .main {
      position: absolute;
      top: 12vh;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 32px;
    }

    .vertical {
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 0.15em;
    }

    .title {
      color: #d6d000;
      font-size: clamp(100px, 25vw, 104px);
      font-weight: 900;
    }

    .subtitle {
      font-size: clamp(68px, 20vw, 74px);
      font-weight: 700;
    }

    .note {
      position: absolute;
      bottom: calc(72px + env(safe-area-inset-bottom));
      width: 100%;
      text-align: center;
      font-size: 12px;
      opacity: 0.8;
    }

    .buttons {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom));
      width: 100%;
      display: flex;
      justify-content: space-around;
      padding: 0 12px;
      box-sizing: border-box;
    }

    button {
      min-width: 140px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      box-shadow: 0 4px 0 rgba(0,0,0,0.4);
    }

    button:active {
      transform: translateY(3px) scale(0.97);
      box-shadow: 0 1px 0 rgba(0,0,0,0.3);
    }

    .btn-help {
      background-color: #fff;
      color: #e60000;
      border: 2px solid #e60000;
    }

    .btn-nippori {
      background-color: #e60000;
      color: #fff;
      border: none;
    }

    button {
      min-width: 140px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;

      transition: transform 0.1s ease, box-shadow 0.1s ease;
      box-shadow: 0 4px 0 rgba(0,0,0,0.4);
    }

    button.pressed {
      transform: translateY(3px) scale(0.97);
      box-shadow: 0 1px 0 rgba(0,0,0,0.3);
    }

  </style>
</head>
<body>

  <div class="container">
    <div class="main">
      <div class="vertical subtitle">されていませんか？</div>
      <div class="vertical title">日暮里</div>
    </div>

    <div class="note">※音は鳴りません</div>

    <div class="buttons">
      <button class="btn-help">助けて！</button>
      <button class="btn-nippori">にっぽりされていませんか？</button>
    </div>
  </div>

</body>
</html>
<script>
  document.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('touchstart', () => {
      btn.classList.add('pressed');
    });

    btn.addEventListener('touchend', () => {
      btn.classList.remove('pressed');
    });

    btn.addEventListener('touchcancel', () => {
      btn.classList.remove('pressed');
    });
  });
</script>
