<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>日暮里されていませんか？</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">

  <!-- iOS用 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="日暮里">

  <link rel="apple-touch-icon" href="icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: 'Noto Sans JP', sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      position: relative;
      height: 100vh;
      width: 100%;
    }

    .main {
      position: absolute;
      top: 12vh;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 32px;
    }

    .vertical {
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 0.15em;
    }

    .title {
      color: #d6d000;
      font-size: clamp(80px, 15vw, 84px);
      font-weight: 900;
    }

    .subtitle {
      font-size: clamp(48px, 12vw, 53px);
      font-weight: 700;
    }

    .note {
      position: absolute;
      bottom: calc(72px + env(safe-area-inset-bottom));
      width: 100%;
      text-align: center;
      font-size: 12px;
      opacity: 0.8;
    }

    .buttons {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom));
      width: 100%;
      display: flex;
      justify-content: space-around;
      padding: 0 12px;
      box-sizing: border-box;
    }

    button {
      min-width: 140px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      box-shadow: 0 4px 0 rgba(0,0,0,0.4);
    }

    button:active {
      transform: translateY(3px) scale(0.97);
      box-shadow: 0 1px 0 rgba(0,0,0,0.3);
    }

    .btn-help {
      background-color: #fff;
      color: #e60000;
      border: 2px solid #e60000;
    }

    .btn-nippori {
      background-color: #e60000;
      color: #fff;
      border: none;
    }

    button {
      min-width: 140px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;

      transition: transform 0.1s ease, box-shadow 0.1s ease;
      box-shadow: 0 4px 0 rgba(0,0,0,0.4);
    }

    button.pressed {
      transform: translateY(3px) scale(0.97);
      box-shadow: 0 1px 0 rgba(0,0,0,0.3);
    }

    .pi {
      position: fixed;
      width: 150px;
      height: 150px;
      pointer-events: none;
      will-change: transform;
      animation-timing-function: linear;
    }

  </style>
</head>
<body>

  <div class="container">
    <div class="main">
      <div class="vertical subtitle">されていませんか？</div>
      <div class="vertical title">日暮里</div>
    </div>

    <div class="note">※音は鳴りません</div>

    <div class="buttons">
      <button id="helpButton" class="btn-help">助けて！</button>
      <button id="nipporiButton" class="btn-nippori">にっぽりされていませんか？</button>
    </div>
  </div>

</body>
</html>
<script>
  let isBusy = false; // 全体ロック用
  const helpButton = document.getElementById('helpButton');
  const nipporiButton = document.getElementById('nipporiButton');
  const bonusBgm = new Audio('resources/sounds/bonus_sound.wav');
  const alertSound = new Audio('resources/sounds/emergency_alert_strong.wav');
  const voiceSound = new Audio('resources/sounds/nippori_help_voice.mp3');
  bonusBgm.loop = true;

  //　button押下時アニメ
  document.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('touchstart', () => {
      btn.classList.add('pressed');
    });

    btn.addEventListener('touchend', () => {
      btn.classList.remove('pressed');
    });

    btn.addEventListener('touchcancel', () => {
      btn.classList.remove('pressed');
    });
  });

  // 助けて押下時
  let isPlaying = false;

  helpButton.addEventListener('click', async () => {
    if (isBusy) return;

    isBusy = true;
    helpButton.disabled = true;
    nipporiButton.disabled = true;

    try {
      const alertSound = new Audio('resources/sounds/emergency_alert_strong.wav');
      const voiceSound = new Audio('resources/sounds/nippori_help_voice.mp3');

      alertSound.currentTime = 0;
      await alertSound.play();

      alertSound.onended = async () => {
        voiceSound.currentTime = 0;
        await voiceSound.play();

        voiceSound.onended = () => {
          isBusy = false;
          helpButton.disabled = false;
          nipporiButton.disabled = false;
        };
      };
    } catch (e) {
      isBusy = false;
      helpButton.disabled = false;
      nipporiButton.disabled = false;
    }
  });

  // にっぽりされてませんか押下時
  let nipporiRunning = false;

  nipporiButton.addEventListener('click', () => {
    if (isBusy) return;

    isBusy = true;
    helpButton.disabled = true;
    nipporiButton.disabled = true;

    if (nipporiRunning) return;

    nipporiRunning = true;
    nipporiButton.disabled = true;

    bonusBgm.currentTime = 0;
    bonusBgm.play();

    const piElements = [];
    const count = Math.floor(Math.random() * 6) + 18; // 18〜23個
    const duration = 22000; // 20秒

    for (let i = 0; i < count; i++) {
      const pi = document.createElement('img');
      pi.src = 'resources/img/pi.png';
      pi.className = 'pi';

      const startX = Math.random() * window.innerWidth;
      const startY = Math.random() * window.innerHeight;

      pi.style.left = `${startX}px`;
      pi.style.top = `${startY}px`;

      const scaleStart = Math.random() * 0.7 + 0.5;
      const scaleEnd = Math.random() * 1.5 + 0.5;
      const rotateStart = Math.random() * 360;
      const rotateEnd = rotateStart + (Math.random() * 720 - 360);

      const moveX = Math.random() * 300 - 150;
      const moveY = Math.random() * 300 - 150;

      pi.animate([
        {
          transform: `translate(0,0) scale(${scaleStart}) rotate(${rotateStart}deg)`
        },
        {
          transform: `translate(${moveX}px, ${moveY}px) scale(${scaleEnd}) rotate(${rotateEnd}deg)`
        }
      ], {
        duration: Math.random() * 3000 + 2000,
        iterations: Infinity,
        direction: 'alternate'
      });

      document.body.appendChild(pi);
      piElements.push(pi);
    }

    setTimeout(() => {
      piElements.forEach(pi => pi.remove());

      bonusBgm.pause();
      bonusBgm.currentTime = 0;

      nipporiRunning = false;
      isBusy = false;
      helpButton.disabled = false;
      nipporiButton.disabled = false;
    }, duration);
  });
</script>
